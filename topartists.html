<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Artists</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        body {
            background-color: #000;
            color: #fff;
            text-align: center;
            padding-bottom: 80px; /* Space for footer */
            animation: fadeIn 1s ease-in-out;
        }
        h1 {
            font-size: 2.5rem;
            margin: 20px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid #fff;
            display: inline-block;
            padding-bottom: 5px;
        }
        .artist-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        .artist {
            width: 80%;
            max-width: 500px;
            padding: 15px;
            margin: 10px;
            background: linear-gradient(45deg, #222, #444);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s, background 0.3s;
        }
        .artist:hover {
            transform: scale(1.05);
            background: linear-gradient(45deg, #444, #666);
        }
        .artist img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
        }
        .artist-info {
            flex: 1;
            text-align: left;
            margin-left: 15px;
        }
        .artist-name {
            font-size: 18px;
            font-weight: bold;
        }
        .artist-genre {
            font-size: 14px;
            color: #aaa;
        }
        .song-list {
            display: none;
            width: 80%;
            max-width: 500px;
            margin-top: 10px;
            background: #111;
            padding: 10px;
            border-radius: 10px;
        }
        .song {
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: background 0.3s;
        }
        .song:hover {
            background: #222;
        }
        .song-title {
            font-size: 16px;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <h1>Top Artists</h1>
    
    <div class="artist-container">
        <!-- Artist 1 -->
        <div class="artist" onclick="toggleSongs('artist1')">
            <img src="weekend.jpg" alt="Artist">
            <div class="artist-info">
                <p class="artist-name">The Weeknd</p>
                <p class="artist-genre">R&B / Pop</p>
            </div>
        </div>
        <div class="song-list" id="artist1">
            <div class="song" onclick="playSong('BlindingLights.mp3', 'Blinding Lights')">
                <span class="song-title">Blinding Lights</span>
            </div>
            <div class="song" onclick="playSong('saveyourtears.mp3', 'Save Your Tears')">
                <span class="song-title">Save Your Tears</span>
            </div>
        </div>

        <!-- Artist 2 -->
        <div class="artist" onclick="toggleSongs('artist2')">
            <img src="drake.jpg" alt="Artist">
            <div class="artist-info">
                <p class="artist-name">Drake</p>
                <p class="artist-genre">Hip-Hop / Rap</p>
            </div>
        </div>
        <div class="song-list" id="artist2">
            <div class="song" onclick="playSong('godsplan.mp3', 'God\'s Plan')">
                <span class="song-title">God's Plan</span>
            </div>
            <div class="song" onclick="playSong('inmyfeel.mp3', 'In My Feelings')">
                <span class="song-title">In My Feelings</span>
            </div>
        </div>
    </div>

    <script>
        function toggleSongs(artistId) {
            let artist = document.getElementById(artistId);
            if (artist.style.display === "none" || artist.style.display === "") {
                artist.style.display = "block";
            } else {
                artist.style.display = "none";
            }
        }

        function playSong(songSrc, songName) {
            console.log("Playing song:", songSrc, songName);

            // Send to footer frame
            parent.frames["footer"].postMessage({ songSrc, songName }, "*");

            // Retrieve existing history or initialize empty array
            let songHistory = JSON.parse(localStorage.getItem("songHistory")) || [];

            // Avoid duplicate entries
            if (!songHistory.some(song => song.songSrc === songSrc)) {
                songHistory.push({ songSrc, songName });
            }

            // Store updated history in localStorage
            localStorage.setItem("songHistory", JSON.stringify(songHistory));
        }
    </script>

</body>
</html>
