<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amrythym - Sign In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background-color: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background-color: #111;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }
        
        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo {
            font-size: 40px;
            margin-bottom: 15px;
        }
        
        h1 {
            font-size: 24px;
            text-align: center;
            margin-bottom: 15px;
            font-weight: 300;
            letter-spacing: 2px;
        }
        
        form {
            margin-top: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            color: #ccc;
        }
        
        input {
            width: 100%;
            padding: 12px;
            background-color: #222;
            border: 1px solid #333;
            color: #fff;
            border-radius: 4px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #fff;
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
        }
        
        button {
            width: 100%;
            padding: 14px;
            background-color: #fff;
            color: #000;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        button:hover {
            background-color: #eee;
        }
        
        .links {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #aaa;
        }
        
        .links a {
            color: #fff;
            text-decoration: none;
            margin: 0 10px;
        }
        
        .links a:hover {
            text-decoration: underline;
        }
    </style>
    <script type="text/javascript">
        function validateForm() {
            alert("0224");

        }

    </script>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <div class="logo">♫</div>
            <h1>AMRYTHYM</h1>
        </div>
        
        <form action="OTP.html">
            <div class="form-group">
                <label for="email">Email or Username</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            
            
            <button type="submit" onclick="validateForm()">Send OTP</button>
        </form>
        
        
    </div>
</body>
</html>
