<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>New Releases</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Arial', sans-serif;
      text-align: center;
      padding: 30px 20px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 30px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: white;
      border-bottom: 2px solid white;
      display: inline-block;
      padding-bottom: 10px;
    }

    .song-list {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-top: 20px;
    }

    .song-item {
      width: 85%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background-color: #111;
      border: 1px solid #333;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
    }

    .song-item:hover {
      transform: translateY(-5px);
      background-color: #1a1a1a;
      box-shadow: 0 8px 20px rgba(255, 255, 255, 0.05);
    }

    .song-name {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      text-align: left;
    }

    .play-icon {
      font-size: 20px;
      color: white;
      transition: transform 0.3s;
    }

    .song-item:hover .play-icon {
      transform: scale(1.3);
      color: #ccc;
    }
  </style>

  <script>
    function playSong(songSrc, songName) {
      // Send song to footer
      parent.frames["footer"].postMessage({ songSrc, songName }, "*");

      // Save to history
      let songHistory = JSON.parse(localStorage.getItem("songHistory")) || [];
      if (!songHistory.some(song => song.songSrc === songSrc)) {
        songHistory.push({ songSrc, songName });
      }
      localStorage.setItem("songHistory", JSON.stringify(songHistory));
    }
  </script>
</head>
<body>

  <h1>New Releases</h1>
  <div class="song-list">
    <div class="song-item" onclick="playSong('CryForMe.mp3', 'Cry For Me')">
      <span class="song-name">Cry For Me</span>
      <span class="play-icon">▶️</span>
    </div>

    <div class="song-item" onclick="playSong('Timeless.mp3', 'Timeless')">
      <span class="song-name">Timeless</span>
      <span class="play-icon">▶️</span>
    </div>

    <div class="song-item" onclick="playSong('Vazhithunaiye.mp3', 'Vazhithunaiye')">
      <span class="song-name">Vazhithunaiye</span>
      <span class="play-icon">▶️</span>
    </div>
  </div>

</body>
</html>
