<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amrythym - Home</title>
    <style>
        /* Reset Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        /* Body Styling */
        body {
            background-color: #000;
            color: #fff;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Background Animation */
        .background {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 10%, transparent 60%);
            animation: pulse 6s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            100% { opacity: 0.6; }
        }

        /* Logo */
        .logo {
            font-size: 60px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeIn 1.5s ease-in-out forwards;
        }

        /* Subtitle */
        .subtitle {
            font-size: 20px;
            color: #aaa;
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeIn 2s ease-in-out forwards 0.5s;
        }

        /* Buttons */
        .btn-container {
            display: flex;
            gap: 20px;
            opacity: 0;
            animation: fadeIn 2s ease-in-out forwards 1s;
        }

        .btn {
            text-decoration: none;
            background: white;
            color: black;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            transition: 0.3s ease;
        }

        .btn:hover {
            background: #ddd;
        }

        /* Fade-in animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

    <div class="background"></div>

    <div class="logo">Amrythym</div>
    <div class="subtitle">Feel the rhythm, embrace the music.</div>

    <div class="btn-container">
        <a href="new_releases.html" class="btn">Explore</a>
        <a href="topcharts.html" class="btn">Listen Now</a>
    </div>

</body>
</html>
