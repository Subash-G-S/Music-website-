<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account - Amrythym</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .account-container {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            text-align: center;
            width: 300px;
        }
        .account-container h2 {
            margin-bottom: 20px;
        }
        .account-container p {
            margin: 10px 0;
        }
        .account-container a {
            display: block;
            padding: 10px;
            margin: 10px 0;
            background: #444;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .account-container a:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="account-container">
        <h2>Account Details</h2>
        <p><strong>Username:</strong> User123</p>
        <p><strong>Email:</strong> user@example.com</p>
        <a href="#">Manage Subscription</a>
        <a href="#">Settings</a>
        <a href="amrythym_sign_in_.html" target="_parent">Log Out</a>
    </div>
</body>
</html>
